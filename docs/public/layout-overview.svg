<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, sans-serif">
  <title id="title">Viewer layout overview</title>
  <desc id="desc">Conceptual layout: 3D viewer top-left, filter strip bottom-left, t-SNE bottom-right, detail panel along the right edge.</desc>
  <style>
    .box { fill: rgba(255,255,255,0.04); stroke: #888; stroke-width: 1.5; rx: 6; ry: 6; }
    .label-major { fill: #ddd; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; }
    .label-minor { fill: #aaa; font-size: 11px; }
    .label-detail { fill: #aaa; font-size: 12px; }
  </style>

  <!-- 3D viewer -->
  <rect class="box" x="10" y="10" width="500" height="180"/>
  <text class="label-major" x="260" y="80" text-anchor="middle">3D BRAIN VIEWER</text>
  <text class="label-minor" x="260" y="100" text-anchor="middle">cells in anatomy</text>

  <!-- Filter strip (bottom-left, slimmer) -->
  <rect class="box" x="10" y="200" width="300" height="150"/>
  <text class="label-major" x="160" y="240" text-anchor="middle">FILTER STRIP</text>
  <text class="label-minor" x="160" y="262" text-anchor="middle">Colors × Transcriptomics</text>
  <text class="label-minor" x="160" y="278" text-anchor="middle">× Stimuli × Swim × Anatomy</text>
  <text class="label-minor" x="160" y="298" text-anchor="middle">+ Settings + About</text>

  <!-- t-SNE -->
  <rect class="box" x="320" y="200" width="190" height="150"/>
  <text class="label-major" x="415" y="265" text-anchor="middle">t-SNE</text>
  <text class="label-minor" x="415" y="285" text-anchor="middle">(lasso)</text>

  <!-- Detail panel (full right column) -->
  <rect class="box" x="520" y="10" width="190" height="340"/>
  <text class="label-major" x="615" y="60" text-anchor="middle">DETAIL</text>
  <text class="label-detail" x="615" y="120" text-anchor="middle">gene bar chart</text>
  <text class="label-detail" x="615" y="180" text-anchor="middle">ΔF/F trace</text>
  <text class="label-detail" x="615" y="240" text-anchor="middle">per-stimulus r</text>
</svg>
