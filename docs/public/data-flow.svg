<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, sans-serif">
  <title id="title">Data flow pipeline</title>
  <desc id="desc">Five-stage pipeline from the published dataset on Figshare, through preprocessing into a bundle, loaded at startup into an in-memory dataset, then filter and color compute into per-cell buffers, finally drawn via the GPU into the 3D viewer, t-SNE, and Detail panel.</desc>
  <style>
    .box { fill: rgba(255,255,255,0.04); stroke: #888; stroke-width: 1.5; rx: 6; ry: 6; }
    .box-label { fill: #ddd; font-size: 14px; font-weight: 600; }
    .edge-label { fill: #999; font-size: 12px; font-style: italic; }
    .arrow { stroke: #888; stroke-width: 1.5; fill: none; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <!-- A: Published dataset -->
  <rect class="box" x="200" y="20"  width="320" height="56"/>
  <text class="box-label" x="360" y="54" text-anchor="middle">Published dataset on Figshare (~30 GB)</text>

  <!-- arrow A -> B -->
  <line class="arrow" x1="360" y1="76" x2="360" y2="140" marker-end="url(#arrow)"/>
  <text class="edge-label" x="378" y="112">preprocessing</text>

  <!-- B: Preprocessed bundle -->
  <rect class="box" x="200" y="148" width="320" height="56"/>
  <text class="box-label" x="360" y="182" text-anchor="middle">Preprocessed bundle (~150 MB)</text>

  <!-- arrow B -> C -->
  <line class="arrow" x1="360" y1="204" x2="360" y2="268" marker-end="url(#arrow)"/>
  <text class="edge-label" x="378" y="240">loaded at startup</text>

  <!-- C: In-memory dataset -->
  <rect class="box" x="200" y="276" width="320" height="56"/>
  <text class="box-label" x="360" y="310" text-anchor="middle">In-memory dataset</text>

  <!-- arrow C -> D -->
  <line class="arrow" x1="360" y1="332" x2="360" y2="396" marker-end="url(#arrow)"/>
  <text class="edge-label" x="378" y="368">filter and color compute</text>

  <!-- D: Per-cell buffers -->
  <rect class="box" x="200" y="404" width="320" height="56"/>
  <text class="box-label" x="360" y="438" text-anchor="middle">Per-cell visibility, color, size buffers</text>

  <!-- arrow D -> E -->
  <line class="arrow" x1="360" y1="460" x2="360" y2="524" marker-end="url(#arrow)"/>
  <text class="edge-label" x="378" y="496">GPU draw call</text>

  <!-- E: Views -->
  <rect class="box" x="200" y="532" width="320" height="56"/>
  <text class="box-label" x="360" y="566" text-anchor="middle">3D viewer, t-SNE, and Detail panel</text>
</svg>
