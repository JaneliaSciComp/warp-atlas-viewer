<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 130" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, sans-serif">
  <title id="title">Five filter cards combined by logical AND</title>
  <desc id="desc">The Filters tab contains five cards arranged in a row — Colors, Transcriptomics, Visual Stimuli, Swim, and Anatomy — combined by logical AND, so a cell must pass every active card to remain visible.</desc>
  <style>
    .box { fill: rgba(255,255,255,0.04); stroke: #888; stroke-width: 1.5; rx: 6; ry: 6; }
    .box-label { fill: #ddd; font-size: 14px; font-weight: 600; }
    .op { fill: #999; font-size: 22px; font-weight: 600; }
    .op-caption { fill: #888; font-size: 10px; font-style: italic; letter-spacing: 0.05em; }
  </style>

  <!-- Colors -->
  <rect class="box" x="20"  y="30" width="140" height="60"/>
  <text class="box-label" x="90" y="66" text-anchor="middle">Colors</text>

  <!-- × -->
  <text class="op"         x="175" y="68" text-anchor="middle">×</text>
  <text class="op-caption" x="175" y="100" text-anchor="middle">AND</text>

  <!-- Transcriptomics -->
  <rect class="box" x="190" y="30" width="140" height="60"/>
  <text class="box-label" x="260" y="66" text-anchor="middle">Transcriptomics</text>

  <!-- × -->
  <text class="op"         x="345" y="68" text-anchor="middle">×</text>
  <text class="op-caption" x="345" y="100" text-anchor="middle">AND</text>

  <!-- Visual Stimuli -->
  <rect class="box" x="360" y="30" width="140" height="60"/>
  <text class="box-label" x="430" y="66" text-anchor="middle">Visual Stimuli</text>

  <!-- × -->
  <text class="op"         x="515" y="68" text-anchor="middle">×</text>
  <text class="op-caption" x="515" y="100" text-anchor="middle">AND</text>

  <!-- Swim -->
  <rect class="box" x="530" y="30" width="140" height="60"/>
  <text class="box-label" x="600" y="66" text-anchor="middle">Swim</text>

  <!-- × -->
  <text class="op"         x="685" y="68" text-anchor="middle">×</text>
  <text class="op-caption" x="685" y="100" text-anchor="middle">AND</text>

  <!-- Anatomy -->
  <rect class="box" x="700" y="30" width="140" height="60"/>
  <text class="box-label" x="770" y="66" text-anchor="middle">Anatomy</text>
</svg>
