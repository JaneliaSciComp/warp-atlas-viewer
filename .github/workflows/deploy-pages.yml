name: Deploy to GitHub Pages

# On-demand only. Trigger from the Actions tab → "Deploy to GitHub Pages"
# → "Run workflow". Fetches preprocessed data from the Janelia S3 bucket,
# bundles the site, and publishes to GitHub Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DATA_BASE_URL: https://s3.janelia.org/ahrens-lab/warp
  PREPROCESSED_FILES: >-
    neurons.json
    activityTrace.bin
    clusterIds.bin
    fishIds.bin
    geneBinary.bin
    geneCounts.bin
    positions.bin
    regionIds.bin
    regressors.bin
    stimulusCorr.bin
    swimCorr.bin
    umap.bin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch preprocessed data from S3
        run: |
          mkdir -p preprocessed
          cd preprocessed
          for f in $PREPROCESSED_FILES; do
            echo "==> $f"
            curl -fSL --retry 3 --retry-delay 2 -o "$f" "$DATA_BASE_URL/$f"
          done
          ls -lh

      - name: Build bundle
        env:
          BASE: /${{ github.event.repository.name }}/
        run: bash scripts/bundle.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
