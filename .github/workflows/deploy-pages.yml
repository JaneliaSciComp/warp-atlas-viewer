name: Deploy to GitHub Pages

# On-demand only. Trigger from the Actions tab → "Deploy to GitHub Pages"
# → "Run workflow". Fetches preprocessed data from the Janelia S3 bucket,
# bundles the site, and publishes to GitHub Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DATA_BASE_URL: https://s3.janelia.org/ahrens-lab/warp/v2
  PREPROCESSED_FILES: >-
    neurons.json
    activityTrace.bin.gz
    atlasRegionMask.bin.gz
    clusterIds.bin.gz
    fishIds.bin.gz
    geneBinary.bin.gz
    geneCounts.bin.gz
    positions.bin.gz
    regionIds.bin.gz
    regressors.bin.gz
    stimulusCorr.bin.gz
    swimCorr.bin.gz
    umap.bin.gz

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch preprocessed data from S3
        run: |
          mkdir -p preprocessed
          cd preprocessed
          for f in $PREPROCESSED_FILES; do
            echo "==> $DATA_BASE_URL/$f"
            curl -fSL --retry 3 --retry-delay 2 -o "$f" "$DATA_BASE_URL/$f"
          done
          ls -lh

      - name: Build bundle
        run: bash scripts/bundle.sh

      - name: Write CNAME for custom domain
        run: echo "warp.janelia.org" > dist/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
